protocol: NetFlowV5
transport: udp
port: 2055

types:
  FlowRecord:
    size: 48
    fields:
      src_ip:    { offset: 0,  type: ipv4 }
      dst_ip:    { offset: 4,  type: ipv4 }
      next_hop:  { offset: 8,  type: ipv4 }
      input_snmp:{ offset: 12, type: u16 }
      output_snmp:{ offset: 14, type: u16 }
      packets:   { offset: 16, type: u32 }
      octets:    { offset: 20, type: u32 }
      src_port:  { offset: 32, type: u16 }
      dst_port:  { offset: 34, type: u16 }
      tcp_flags: { offset: 36, type: u8 }

  NetFlowHeader:
    size: 24
    fields:
      version: { offset: 0, type: u16 }
      count:   { offset: 2, type: u16 }
      uptime:  { offset: 4, type: u32 }

layout:
  header: NetFlowHeader
  payload:
    type: array
    element_type: FlowRecord
    length_field: header.count
    max_elements: 30

observability:
  filters:
    - field: payload[0].tcp_flags
      op: BITWISE_AND
      value: 0x02
  metrics:
    - field: payload[0].dst_port